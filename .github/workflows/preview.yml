name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: github.event.action != 'closed'
        run: npm ci && npm run build
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
      # Publishes dist/ to gh-pages under pr-preview/pr-<n>/, comments the URL on the PR
      # and removes the folder again when the PR is closed.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          pages-base-url: ai-solutions.dev
